name: Nouveautés Numista
on:
  schedule:
    - cron: "7 2 * * 1"    # chaque lundi vers 3h du matin, heure de Paris (4h en été)
  workflow_dispatch: {}      # bouton « Run workflow » pour le lancer à la main
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Chercher les nouveautés
        env:
          NUMISTA_API_KEY: ${{ secrets.NUMISTA_API_KEY }}
          MAX_REQUESTS: "350"   # 5 lundis max par mois × 350 = sous le quota Numista de 2000/mois
        run: node scripts/update-numista.mjs
      - name: Placer les nouvelles pièces sur la carte
        continue-on-error: true
        run: node scripts/geocode.mjs
      - name: Publier la mise à jour
        run: |
          git config user.name "Robot Médaillier"
          git config user.email "actions@users.noreply.github.com"
          git add catalogue.json scripts/seen.json scripts/last-run.txt geo.json geo-old.json geo-miss.json scripts/geo-log.txt 2>/dev/null; git add catalogue.json scripts/seen.json scripts/last-run.txt
          git diff --cached --quiet || (git commit -m "Nouveautés Numista de la semaine" && (git pull --rebase -q && git push -q || (sleep 10 && git pull --rebase -q && git push -q)))
