name: Nouveautés Numista
on:
  schedule:
    - cron: "17 5 1 * *"   # le 1er de chaque mois, vers 6h-7h heure de Paris
  workflow_dispatch: {}      # bouton « Run workflow » pour le lancer à la main
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Chercher les nouveautés
        env:
          NUMISTA_API_KEY: ${{ secrets.NUMISTA_API_KEY }}
        run: node scripts/update-numista.mjs
      - name: Publier la mise à jour
        run: |
          git config user.name "Robot Médaillier"
          git config user.email "actions@users.noreply.github.com"
          git add catalogue.json scripts/seen.json scripts/last-run.txt
          git diff --cached --quiet || (git commit -m "Nouveautés Numista du mois" && git push)
